name: ClaudeUsage

# --------------------------------------------------------------------------
# bundleIdPrefix and PRODUCT_BUNDLE_IDENTIFIER below are already set to
# this repo owner's real reverse-DNS prefix (com.terrykhm) and Team ID —
# if you fork this for your own use, replace both with your own values.
#
# DEVELOPMENT_TEAM is set explicitly below (not left to Xcode's UI) —
# `xcodegen generate` regenerates the .xcodeproj from this file every
# time, which silently wipes out any Team selected only in Xcode's
# Signing & Capabilities UI. Find your own Team ID via Keychain Access:
# login keychain -> My Certificates -> your "Apple Development: ..."
# certificate -> Details -> Organizational Unit. Works for a free
# Personal Team too, not just paid memberships.
#
# Neither target declares an App Group — that's intentional, so this
# builds and runs on a free Apple ID/Personal Team, which Apple blocks
# from using the App Groups capability. The app and widget instead share
# data via a plain file under ~/Library/Application Support/ClaudeUsage/
# (see Packages/ClaudeUsageKit/Sources/ClaudeUsageKit/Storage/).
#
# The widget extension target DOES declare App Sandbox (see its
# .entitlements file) — macOS requires that for a WidgetKit extension to
# register with pluginkitd at all. Without it the .appex builds, signs,
# and embeds correctly but never appears in `pluginkit -m` or the Edit
# Widgets gallery, with no error anywhere. It reaches the shared file via
# a temporary-exception entitlement instead of an App Group container.
# See README.md for the full Mac-side setup checklist.
# --------------------------------------------------------------------------

options:
  bundleIdPrefix: com.terrykhm.claudeusage
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  ClaudeUsageKit:
    path: Packages/ClaudeUsageKit

targets:
  ClaudeUsageMenuBar:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App/ClaudeUsageMenuBar
    dependencies:
      - package: ClaudeUsageKit
      - target: ClaudeUsageWidgetExtension
        embed: true
    info:
      path: App/ClaudeUsageMenuBar/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: AI Meter
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSHumanReadableCopyright: ""
        # aimeter:// — lets the widget's signed-out state open the app
        # (it can't host the real WKWebView sign-in flow itself). See
        # AppDelegate.application(_:open:).
        CFBundleURLTypes:
          - CFBundleURLName: com.terrykhm.claudeusage
            CFBundleURLSchemes:
              - aimeter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.terrykhm.claudeusage
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5DQVAL7YAZ
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        SWIFT_VERSION: "5.0"

  ClaudeUsageWidgetExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Widget/ClaudeUsageWidgetExtension
      # Shared "Warm Frosted" SwiftUI design-system tokens, physically
      # owned by the app target's sources but included here too so both
      # targets render an identical visual style without duplicating them.
      - path: App/ClaudeUsageMenuBar/DesignSystem/GlassPanel.swift
        group: DesignSystem
      - path: App/ClaudeUsageMenuBar/DesignSystem/UsageColors.swift
        group: DesignSystem
    dependencies:
      - package: ClaudeUsageKit
    info:
      path: Widget/ClaudeUsageWidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: Claude
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.terrykhm.claudeusage.widget
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5DQVAL7YAZ
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_ENTITLEMENTS: Widget/ClaudeUsageWidgetExtension/ClaudeUsageWidgetExtension.entitlements

schemes:
  ClaudeUsageMenuBar:
    build:
      targets:
        ClaudeUsageMenuBar: all
        ClaudeUsageWidgetExtension: all
    run:
      config: Debug
    archive:
      config: Release
