name: ClaudeUsage

# --------------------------------------------------------------------------
# Before running `xcodegen generate`, replace these two placeholder tokens
# EVERYWHERE they appear in this repo (search-and-replace, case-sensitive):
#
#   REPLACE_ME_BUNDLE_PREFIX  -> your reverse-DNS prefix, e.g. com.yourname
#   REPLACE_ME_TEAM_ID        -> your Apple Developer Team ID
#
# They also appear in:
#   App/ClaudeUsageMenuBar/ClaudeUsageMenuBar.entitlements
#   Widget/ClaudeUsageWidgetExtension/ClaudeUsageWidgetExtension.entitlements
#   Packages/ClaudeUsageKit/Sources/ClaudeUsageKit/Storage/AppGroupConstants.swift
#
# All three must agree on the exact same App Group identifier or the app
# and widget will not be able to share data. See README.md for the full
# Mac-side setup checklist.
# --------------------------------------------------------------------------

options:
  bundleIdPrefix: REPLACE_ME_BUNDLE_PREFIX.claudeusage
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  ClaudeUsageKit:
    path: Packages/ClaudeUsageKit

targets:
  ClaudeUsageMenuBar:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App/ClaudeUsageMenuBar
    dependencies:
      - package: ClaudeUsageKit
      - target: ClaudeUsageWidgetExtension
        embed: true
    info:
      path: App/ClaudeUsageMenuBar/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Claude Usage
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSHumanReadableCopyright: ""
    entitlements:
      path: App/ClaudeUsageMenuBar/ClaudeUsageMenuBar.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: REPLACE_ME_BUNDLE_PREFIX.claudeusage
        CODE_SIGN_ENTITLEMENTS: App/ClaudeUsageMenuBar/ClaudeUsageMenuBar.entitlements
        DEVELOPMENT_TEAM: REPLACE_ME_TEAM_ID
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: true

  ClaudeUsageWidgetExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Widget/ClaudeUsageWidgetExtension
      # Shared "Warm Frosted" SwiftUI design-system tokens, physically
      # owned by the app target's sources but included here too so both
      # targets render an identical visual style without duplicating them.
      - path: App/ClaudeUsageMenuBar/DesignSystem/GlassPanel.swift
        group: DesignSystem
      - path: App/ClaudeUsageMenuBar/DesignSystem/UsageColors.swift
        group: DesignSystem
    dependencies:
      - package: ClaudeUsageKit
    info:
      path: Widget/ClaudeUsageWidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: Claude Usage Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/ClaudeUsageWidgetExtension/ClaudeUsageWidgetExtension.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: REPLACE_ME_BUNDLE_PREFIX.claudeusage.widget
        CODE_SIGN_ENTITLEMENTS: Widget/ClaudeUsageWidgetExtension/ClaudeUsageWidgetExtension.entitlements
        DEVELOPMENT_TEAM: REPLACE_ME_TEAM_ID
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: true

schemes:
  ClaudeUsageMenuBar:
    build:
      targets:
        ClaudeUsageMenuBar: all
        ClaudeUsageWidgetExtension: all
    run:
      config: Debug
    archive:
      config: Release
