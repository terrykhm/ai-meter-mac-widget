name: AIMeter

# --------------------------------------------------------------------------
# bundleIdPrefix and PRODUCT_BUNDLE_IDENTIFIER below are already set to
# this repo owner's real reverse-DNS prefix (com.terrykhm) and Team ID —
# if you fork this for your own use, replace both with your own values.
#
# DEVELOPMENT_TEAM is set explicitly below (not left to Xcode's UI) —
# `xcodegen generate` regenerates the .xcodeproj from this file every
# time, which silently wipes out any Team selected only in Xcode's
# Signing & Capabilities UI. Find your own Team ID via Keychain Access:
# login keychain -> My Certificates -> your certificate -> Details ->
# Organizational Unit.
#
# Debug builds sign with the free-tier "Apple Development" identity via
# Automatic signing, for local run/debug — this still works on a plain
# free Apple ID with no paid Developer Program membership, so cloning and
# building from source doesn't require paying Apple anything. Release
# builds (what gets archived/notarized/distributed) sign with a paid
# "Developer ID Application" identity instead — see "Distribution
# builds" in README.md for the notarization steps that requires.
#
# Neither target declares an App Group. That's not a hard requirement
# anymore (this Team ID does now have a paid membership, which unlocks
# App Groups) — it's just that the existing plain-file/temporary-exception
# approach already works, including through notarization, so there's been
# no reason to migrate it. The app and widget share data via a plain file
# under ~/Library/Application Support/AIMeter/ (see
# Packages/AIMeterKit/Sources/AIMeterKit/Storage/).
#
# The widget extension target DOES declare App Sandbox (see its
# .entitlements file) — macOS requires that for a WidgetKit extension to
# register with pluginkitd at all. Without it the .appex builds, signs,
# and embeds correctly but never appears in `pluginkit -m` or the Edit
# Widgets gallery, with no error anywhere. It reaches the shared file via
# a temporary-exception entitlement instead of an App Group container.
# See README.md for the full Mac-side setup checklist.
# --------------------------------------------------------------------------

options:
  bundleIdPrefix: com.terrykhm.aimeter
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  AIMeterKit:
    path: Packages/AIMeterKit

targets:
  AIMeterMenuBar:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App/AIMeterMenuBar
    dependencies:
      - package: AIMeterKit
      - target: AIMeterWidgetExtension
        embed: true
    info:
      path: App/AIMeterMenuBar/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: AI Meter
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSHumanReadableCopyright: ""
        LSApplicationCategoryType: public.app-category.utilities
        # aimeter:// — lets the widget's signed-out state open the app
        # (it can't host the real WKWebView sign-in flow itself). See
        # AppDelegate.application(_:open:).
        CFBundleURLTypes:
          - CFBundleURLName: com.terrykhm.aimeter
            CFBundleURLSchemes:
              - aimeter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.terrykhm.aimeter
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5DQVAL7YAZ
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        SWIFT_VERSION: "5.0"
      configs:
        # Debug stays on the free-tier "Apple Development" identity via
        # Automatic signing, for local run/debug. Release switches to the
        # paid "Developer ID Application" identity (Manual — Developer ID
        # doesn't use provisioning profiles) with Hardened Runtime, which
        # notarization requires.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          ENABLE_HARDENED_RUNTIME: YES

  AIMeterWidgetExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Widget/AIMeterWidgetExtension
      # Shared "Warm Frosted" SwiftUI design-system tokens, physically
      # owned by the app target's sources but included here too so both
      # targets render an identical visual style without duplicating them.
      - path: App/AIMeterMenuBar/DesignSystem/GlassPanel.swift
        group: DesignSystem
      - path: App/AIMeterMenuBar/DesignSystem/UsageColors.swift
        group: DesignSystem
    dependencies:
      - package: AIMeterKit
    info:
      path: Widget/AIMeterWidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: Claude
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.terrykhm.aimeter.widget
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5DQVAL7YAZ
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_ENTITLEMENTS: Widget/AIMeterWidgetExtension/AIMeterWidgetExtension.entitlements
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          ENABLE_HARDENED_RUNTIME: YES

schemes:
  AIMeterMenuBar:
    build:
      targets:
        AIMeterMenuBar: all
        AIMeterWidgetExtension: all
    run:
      config: Debug
    archive:
      config: Release
